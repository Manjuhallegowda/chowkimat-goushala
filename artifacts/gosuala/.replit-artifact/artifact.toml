kind = "web"
previewPath = "/"
title = "Gosuala Temple"
version = "1.0.0"
id = "artifacts/gosuala"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25043

[services.development]
run = "pnpm --filter @workspace/gosuala run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gosuala", "run", "build" ]
publicDir = "artifacts/gosuala/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25043"
BASE_PATH = "/"
